name: Docs

on:
  push:
    branches:
      - main
      - '*-1.0'
      - 'dev-*'
    paths:
      - '.github/**'
      - '*gradle*'
      - 'docs/**'
      - 'gradle/**'
      - 'src/main/**'
      - 'src/java9/**'
  pull_request:
    branches:
      - main
      - '*-1.0'
      - 'dev-*'
    paths:
      - '.github/**'
      - '*gradle*'
      - 'docs/**'
      - 'gradle/**'
      - 'src/main/**'
      - 'src/java9/**'

permissions:
  contents: read

jobs:
  # Runs on PRs and push to ensure the documentation successfully builds.
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    env:
      JAVA_VERSION: 26
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@e498d2a66a953492f322542257b22125c989b422
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92

      - name: Build docs
        run: ./gradlew buildDocs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: docs/build

  # Deploys the documentation if this is a push to the main branch.
  deploy:
    name: Deploy Documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
